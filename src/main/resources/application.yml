spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taskdb
    username: taskuser
    password: secret
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
  jackson:
    serialization:
      indent-output: true
  sql:
    init:
      platform: postgres
server:
  port: 8080
jwt:
  secret: my-super-secret-key-which-should-be-long-enough-and-secure
  expiration: 86400000 # 1 day in milliseconds
